# Example docker-compose.yml entry for JarvisAgent
# Add this service to your main docker-compose.yml file

version: "3.8"

services:
  jarvis_agent:
    image: ghcr.io/beaumanvienna/jarvisagent:main
    container_name: jarvis_agent
    restart: unless-stopped

    # Container hardening — recommended for production deployments.
    # - no-new-privileges blocks setuid/setgid escalation inside the container.
    # - Docker's default capability set already excludes CAP_SYS_PTRACE, so the
    #   master-password SecureString mlock protection holds against in-container
    #   attackers by default. Critical: do NOT run with `--privileged`, do NOT
    #   `cap_add: SYS_PTRACE`, and do NOT add --security-opt apparmor=unconfined
    #   unless you fully understand the consequences (rationale in
    #   `doc/cyber security.md`).
    security_opt:
      - no-new-privileges:true

    # Optional: Use environment file for API keys
    # env_file:
    #   - ./jarvis_agent.env

    # Optional: Mount queue directory if you want persistence
    volumes:
      - jarvis-queue:/app/queue
      # Optional: Mount custom config.json
      # - ./jarvis_config.json:/app/config.json:ro

      # Traefik labels for HTTPS and subdomain routing
    labels:
      traefik.enable: "true"
      traefik.http.routers.jarvis_agent.rule: Host(`jarvis-agent.example.com`)
      traefik.http.routers.jarvis_agent.entrypoints: websecure
      traefik.http.routers.jarvis_agent.tls.certresolver: le
      traefik.http.services.jarvis_agent.loadbalancer.server.port: "8080"

    networks:
      - web

    # Health check
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/status')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # MCP sidecar — exposes j9t workflows to Claude Desktop, Claude Code, and other MCP clients
  j9t_mcp:
    build: ./mcp
    container_name: j9t_mcp
    restart: unless-stopped
    depends_on:
      - jarvis_agent
    environment:
      J9T_URL: http://jarvis_agent:8080
      # j9t authenticates MCP clients with per-user MCP API keys (Authorization: Bearer mcp_...).
      # Mount a secret file containing the key into /secrets/mcp_key, or set J9T_TOKEN inline
      # with the key string. On j9t's first run an admin enrollment token is printed to stderr —
      # activate it at POST /api/auth/mcp-keys/activate to obtain a real key.
      J9T_TOKEN_FILE: /secrets/mcp_key
      J9T_MCP_TRANSPORT: sse
      J9T_MCP_PORT: "3100"
    volumes:
      - jarvis-queue:/app:ro
      - ./secrets:/secrets:ro
    ports:
      - "3100:3100"
    networks:
      - web

networks:
  web:
    external: true

volumes:
  jarvis-queue:
    driver: local
