app-id: com.jctechnolabs.JarvisAgent
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node20

command: jarvisagent-wrapper

finish-args:
  # Network access for AI API calls
  - --share=network
  # Filesystem access for queue/, workflows/, log/, config
  - --filesystem=home
  # X11/Wayland for potential future GUI
  - --socket=x11
  - --socket=wayland
  # Terminal access
  - --device=dri

modules:
  # ---- libpq (PostgreSQL client library) ----
  - name: libpq
    buildsystem: simple
    build-commands:
      - ./configure --prefix=/app --without-readline --without-zlib --without-icu
      - make -C src/interfaces/libpq -j${FLATPAK_BUILDER_N_JOBS}
      - make -C src/interfaces/libpq install
      - make -C src/include install
      - install -Dm644 src/include/postgres_ext.h /app/include/postgres_ext.h
    sources:
      - type: git
        url: https://github.com/postgres/postgres.git
        tag: REL_17_5

  # ---- premake5 (build tool, not shipped) ----
  - name: premake5
    buildsystem: simple
    build-commands:
      - make -f Bootstrap.mak linux PLATFORM=x64
      - install -Dm755 bin/release/premake5 /app/bin/premake5
    sources:
      - type: git
        url: https://github.com/premake/premake-core.git
        tag: v5.0.0-beta8

  # ---- JarvisAgent ----
  - name: jarvisagent
    buildsystem: simple
    build-options:
      env:
        PATH: /app/bin:/usr/lib/sdk/node20/bin:/usr/bin:/bin
    build-commands:
      # Build Engine edition
      - premake5 gmake --engine
      - sh -c 'export CPLUS_INCLUDE_PATH="/app/include:$(python3 -c "import sysconfig; print(sysconfig.get_path(\"include\"))")"; export LIBRARY_PATH="/app/lib"; make -j${FLATPAK_BUILDER_N_JOBS} config=release'

      # Build Studio edition (default)
      - premake5 gmake
      - sh -c 'export CPLUS_INCLUDE_PATH="/app/include:$(python3 -c "import sysconfig; print(sysconfig.get_path(\"include\"))")"; export LIBRARY_PATH="/app/lib"; make -j${FLATPAK_BUILDER_N_JOBS} config=release'

      # Build React dashboard
      - cd code/frontend/dashboard/ui && npm install && npm run build

      # Build React workflow editor
      - cd code/frontend/workflow-editor/ui && npm install && npm run build

      # ---- Install ----
      # Binaries (Studio + Engine)
      - install -Dm755 bin/Release/jarvisAgent-studio /app/share/jarvisagent/bin/jarvisAgent-studio
      - install -Dm755 bin/Release/jarvisAgent-engine /app/share/jarvisagent/bin/jarvisAgent-engine

      # React UIs
      - mkdir -p /app/share/jarvisagent/dashboard/ui
      - cp -r code/frontend/dashboard/ui/dist /app/share/jarvisagent/dashboard/ui/dist
      - mkdir -p /app/share/jarvisagent/workflow-editor/ui
      - cp -r code/frontend/workflow-editor/ui/dist /app/share/jarvisagent/workflow-editor/ui/dist

      # Scripts (excluding __pycache__)
      - cp -r scripts /app/share/jarvisagent/scripts
      - find /app/share/jarvisagent/scripts -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
      - chmod +x /app/share/jarvisagent/scripts/*.sh

      # Example workflows (curated set — single source: packaging/curated-workflows.txt)
      - mkdir -p /app/share/jarvisagent/example-workflows
      - grep -E '^[a-zA-Z]' packaging/curated-workflows.txt | while read -r jcwf; do cp example/workflows/${jcwf}.jcwf /app/share/jarvisagent/example-workflows/ 2>/dev/null || true; done
      # Loose input files are now bundled inside the .jcwf zip containers.

      # Example config
      - cp packaging/config.json.example /app/share/jarvisagent/config.json.example

      # Documentation
      - mkdir -p /app/share/jarvisagent/doc
      - cp README.md /app/share/jarvisagent/doc/README.md
      - cp doc/JC_Workflow_Specification.md /app/share/jarvisagent/doc/JC_Workflow_Specification.md 2>/dev/null || true
      - cp doc/jarvisagent.1 /app/share/jarvisagent/doc/jarvisagent.1 2>/dev/null || true

      # Wrapper script
      - install -Dm755 packaging/Linux/Flatpak/jarvisagent-wrapper.sh /app/bin/jarvisagent-wrapper

      # Desktop file and icon
      - install -Dm644 packaging/Linux/Flatpak/com.jctechnolabs.JarvisAgent.desktop /app/share/applications/com.jctechnolabs.JarvisAgent.desktop

    sources:
      - type: git
        url: https://github.com/beaumanvienna/JarvisAgent.git
        branch: main
