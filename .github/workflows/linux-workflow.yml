name: "🐧Linux"

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Extract version
        id: version
        run: |
          PKG_VERSION=$(grep 'JARVIS_AGENT_VERSION' premake5.lua | sed 's/.*\\"\(.*\)\\".*$/\1/')
          echo "version=$PKG_VERSION" >> $GITHUB_OUTPUT
          echo "Package version: $PKG_VERSION"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential gcc g++ make \
            python3 python3-pip python3-venv \
            zlib1g-dev

      - name: Install pipx
        run: |
          python3 -m pip install --user pipx
          python3 -m pipx ensurepath
          pipx --version

      - name: Install MarkItDown
        run: pipx install "markitdown[all]"

      - name: Install Premake5
        uses: abel0b/setup-premake@v2
        with:
          version: "5.0.0-beta2"

      - name: Generate Makefiles
        run: premake5 gmake

      - name: Set parallel build flags
        run: echo "MAKEFLAGS=-j$(nproc)" >> $GITHUB_ENV

      - name: Build Release (parallel)
        run: |
          echo "Using $(nproc) cores"
          make -j$(nproc) config=release verbose=1

      - name: Build Debug (parallel)
        run: |
          echo "Using $(nproc) cores"
          make -j$(nproc) config=debug verbose=1

      - name: Smoke test (Release)
        run: |
          ./bin/Release/jarvisAgent --help || true

      - name: Smoke test (Debug)
        run: |
          ./bin/Debug/jarvisAgent --help || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build React dashboard
        run: |
          cd dashboard/ui
          npm install
          npm run build

      - name: Build React workflow editor
        run: |
          cd workflow-editor/ui
          npm install
          npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-outputs
          path: |
            bin/Release/jarvisAgent
            dashboard/ui/dist/
            workflow-editor/ui/dist/

      - name: Generate Makefiles (Studio edition)
        run: premake5 gmake --studio

      - name: Build Studio Release (parallel)
        run: |
          echo "Using $(nproc) cores"
          make -j$(nproc) config=release verbose=1

      - name: Smoke test Studio (Release)
        run: |
          ./bin/Release/jarvisAgent --help || true

      - name: Upload Studio build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-outputs-studio
          path: bin/Release/jarvisAgent

  package-deb:
    needs: build-linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-build-outputs
          path: .

      - name: Build DEB package
        run: bash packaging/Linux/Ubuntu/24_04/build-deb.sh --dry-run

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: JarvisAgent-${{ needs.build-linux.outputs.version }}-deb
          path: packaging/Linux/Ubuntu/24_04/build/*.deb
          if-no-files-found: warn

  package-appimage:
    needs: build-linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-build-outputs
          path: .

      - name: Install appimagetool
        run: |
          wget -q -O appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          mkdir -p "$HOME/bin"
          mv appimagetool "$HOME/bin/"
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: bash packaging/Linux/AppImage/build-appimage.sh --dry-run

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: JarvisAgent-${{ needs.build-linux.outputs.version }}-AppImage
          path: packaging/Linux/AppImage/build/*.AppImage
          if-no-files-found: warn

  package-rpm:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container: rockylinux:9

    steps:
      - name: Install system dependencies
        run: |
          dnf update -y python3
          dnf install -y --allowerasing --nobest \
            gcc gcc-c++ make git wget tar \
            python3 python3-devel python3-pip \
            zlib-devel rpm-build
          dnf module reset -y nodejs
          dnf module enable -y nodejs:20
          dnf install -y nodejs npm

      - name: Install Premake5
        run: |
          cd /tmp
          wget -q https://github.com/premake/premake-core/releases/download/v5.0.0-beta2/premake-5.0.0-beta2-linux.tar.gz
          tar -xzf premake-5.0.0-beta2-linux.tar.gz
          mv premake5 /usr/local/bin/
          chmod +x /usr/local/bin/premake5

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Extract version
        id: version
        run: |
          PKG_VERSION=$(grep 'JARVIS_AGENT_VERSION' premake5.lua | sed 's/.*\\"\(.*\)\\".*$/\1/')
          echo "version=$PKG_VERSION" >> $GITHUB_OUTPUT

      - name: Build RPM package
        run: |
          cd packaging/Linux/RPM
          bash build-rpm.sh

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: JarvisAgent-${{ steps.version.outputs.version }}-rpm
          path: packaging/Linux/RPM/build/*.rpm
          if-no-files-found: warn

  package-arch:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel python python-pip zlib nodejs npm git wget

      - name: Install Premake5
        run: |
          cd /tmp
          wget -q https://github.com/premake/premake-core/releases/download/v5.0.0-beta2/premake-5.0.0-beta2-linux.tar.gz
          tar -xzf premake-5.0.0-beta2-linux.tar.gz
          mv premake5 /usr/local/bin/
          chmod +x /usr/local/bin/premake5

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Extract version
        id: version
        run: |
          PKG_VERSION=$(grep 'JARVIS_AGENT_VERSION' premake5.lua | sed 's/.*\\"\(.*\)\\".*$/\1/')
          echo "version=$PKG_VERSION" >> $GITHUB_OUTPUT

      - name: Prepare Arch build environment
        run: |
          # makepkg refuses to run as root — create a build user
          useradd -m builduser

          # Extract version from premake5.lua
          PKG_VERSION=$(grep 'JARVIS_AGENT_VERSION' premake5.lua | sed 's/.*\\"\(.*\)\\".*$/\1/')

          # Create source tarball (with submodules, without .git metadata)
          BUILD_DIR="/home/builduser/build"
          mkdir -p "$BUILD_DIR"
          tar czf "$BUILD_DIR/JarvisAgent-src.tar.gz" \
            --transform 's,^\.,JarvisAgent,' \
            --exclude='.git' \
            --exclude='node_modules' \
            -C "$GITHUB_WORKSPACE" .

          # Copy and patch PKGBUILD for CI
          cp packaging/Linux/Arch/PKGBUILD "$BUILD_DIR/"
          cp packaging/Linux/Arch/jarvisagent.install "$BUILD_DIR/"
          cd "$BUILD_DIR"

          # Use local tarball instead of git clone
          sed -i "s|source=.*|source=('JarvisAgent-src.tar.gz')|" PKGBUILD
          sed -i "s|sha256sums=.*|sha256sums=('SKIP')|" PKGBUILD

          # Replace pkgver() with static version (no .git available)
          sed -i "/^pkgver()/,/^}/c\\pkgver() { echo \"${PKG_VERSION}\"; }" PKGBUILD

          # Remove git submodule from prepare() (already included in tarball)
          sed -i '/git submodule/d' PKGBUILD

          # Remove premake from makedepends (installed manually, not in Arch repos)
          sed -i "s/'premake'//" PKGBUILD

          chown -R builduser:builduser "$BUILD_DIR"

      - name: Build Arch package
        run: |
          su builduser -c "cd /home/builduser/build && makepkg --noconfirm --skipchecksums --nodeps"

      - name: Upload Arch artifact
        uses: actions/upload-artifact@v4
        with:
          name: JarvisAgent-${{ steps.version.outputs.version }}-arch
          path: /home/builduser/build/*.pkg.tar.zst
          if-no-files-found: warn

  package-flatpak:
    needs: build-linux
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Install Flatpak
        run: |
          sudo apt update
          sudo apt install -y flatpak flatpak-builder

      - name: Install Flatpak SDKs
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.freedesktop.Sdk//24.08 org.freedesktop.Platform//24.08

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Pre-build React UIs
        run: |
          cd dashboard/ui && npm install && npm run build && cd ../..
          cd workflow-editor/ui && npm install && npm run build

      - name: Patch manifest for local source
        run: |
          cd packaging/Linux/Flatpak
          # Replace only the JarvisAgent source (not premake5's type: git)
          sed -i 's|url: https://github.com/beaumanvienna/JarvisAgent.git|path: ../../..|' com.jctechnolabs.JarvisAgent.yml
          sed -i '/branch: main/d' com.jctechnolabs.JarvisAgent.yml
          # Change type: git → type: dir only on the line before path: ../../..
          sed -i '/type: git/{N;/path: \.\.\//s/type: git/type: dir/}' com.jctechnolabs.JarvisAgent.yml
          # Remove npm build commands (UIs are pre-built on the runner)
          sed -i '/npm install && npm run build/d' com.jctechnolabs.JarvisAgent.yml
          # Remove node20 SDK extension (no longer needed)
          sed -i '/node20/d' com.jctechnolabs.JarvisAgent.yml

      - name: Build Flatpak
        run: bash packaging/Linux/Flatpak/build-flatpak.sh

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: JarvisAgent-${{ needs.build-linux.outputs.version }}-flatpak
          path: packaging/Linux/Flatpak/build/*.flatpak
          if-no-files-found: warn
