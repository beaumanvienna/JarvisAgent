name: "🍎macOS"

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install pipx
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --user pipx
          python3 -m pipx ensurepath
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          pipx --version

      - name: Install MarkItDown
        run: pipx install "markitdown[all]"

      - name: Install libpq
        run: |
          brew install libpq
          echo "PKG_CONFIG_PATH=$(brew --prefix libpq)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> $GITHUB_ENV

      - name: Install Premake5
        uses: abel0b/setup-premake@v2
        with:
          version: "5.0.0-beta2"

      - name: Extract version
        id: version
        run: |
          PKG_VERSION=$(grep 'JARVIS_AGENT_VERSION' premake5.lua | sed 's/.*\\"\(.*\)\\".*$/\1/')
          echo "version=$PKG_VERSION" >> $GITHUB_OUTPUT
          echo "Package version: $PKG_VERSION"

      - name: Build Engine Release
        run: |
          premake5 gmake --engine
          CORES=$(sysctl -n hw.ncpu)
          echo "Using ${CORES} cores"
          make -j${CORES} config=release verbose=1

      - name: Smoke test Engine (Release)
        run: |
          ./bin/Release/jarvisAgent-engine --help || true

      - name: Build Studio Release (default)
        run: |
          premake5 gmake
          CORES=$(sysctl -n hw.ncpu)
          echo "Using ${CORES} cores"
          make -j${CORES} config=release verbose=1

      - name: Smoke test Studio (Release)
        run: |
          ./bin/Release/jarvisAgent-studio --help || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ---- Packaging: main branch only ----
      # Feature/refactor branches only need the build smoke test.

      - name: Package DMG
        if: github.ref == 'refs/heads/main'
        run: packaging/macOS/Tahoe/build-dmg.sh

      - name: Smoke test DMG
        if: github.ref == 'refs/heads/main'
        run: |
          DMG=$(ls packaging/macOS/Tahoe/build/*.dmg | head -1)
          echo "Mounting $DMG"
          hdiutil attach "$DMG" -nobrowse -mountpoint /Volumes/JarvisAgent
          /Volumes/JarvisAgent/JarvisAgent.app/Contents/MacOS/jarvisAgent --help || true
          hdiutil detach /Volumes/JarvisAgent

      - name: Upload DMG artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: JarvisAgent-${{ steps.version.outputs.version }}-macOS-dmg
          path: packaging/macOS/Tahoe/build/*.dmg
          if-no-files-found: warn
