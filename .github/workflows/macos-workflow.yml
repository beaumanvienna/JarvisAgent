name: "🍎macOS"

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive


      - name: Generate macOS curl_config.h (clone upstream curl)
        shell: bash
        run: |
          set -euxo pipefail

          # Clone a fresh copy of curl so we have configure/buildconf available.
          rm -rf curl
          git clone --depth 1 https://github.com/curl/curl.git curl

          # buildconf/configure needs autotools on macOS runners.
          brew install autoconf automake libtool pkg-config || true

          cd curl
          mkdir build && cd build

          cmake .. -DBUILD_SHARED_LIBS=OFF -DCURL_USE_OPENSSL=ON -DUSE_NGHTTP2=ON -DCURL_USE_LIBPSL=OFF -DCMAKE_VERBOSE_MAKEFILE=ON -DHAVE_BROTLI=OFF
          
          cat ./lib/curl_config.h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install pipx
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --user pipx
          python3 -m pipx ensurepath
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          pipx --version

      - name: Install MarkItDown
        run: pipx install "markitdown[all]"

      - name: Install Premake5
        uses: abel0b/setup-premake@v2
        with:
          version: "5.0.0-beta2"

      - name: Generate Makefiles
        run: premake5 gmake

      - name: Build Release (parallel)
        run: |
          CORES=$(sysctl -n hw.ncpu)
          echo "Using ${CORES} cores"
          make -j${CORES} config=release verbose=1

      - name: Build Debug (parallel)
        run: |
          CORES=$(sysctl -n hw.ncpu)
          echo "Using ${CORES} cores"
          make -j${CORES} config=debug verbose=1

      - name: Smoke test (Release)
        run: |
          ./bin/Release/jarvisAgent --help || true

      - name: Smoke test (Debug)
        run: |
          ./bin/Debug/jarvisAgent --help || true
