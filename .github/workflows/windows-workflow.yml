name: "🪟Windows"

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install pipx
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --user pipx
          python -m pipx ensurepath

          $pipxBin = Join-Path $env:USERPROFILE ".local\\bin"
          if (Test-Path $pipxBin)
          {
            "$pipxBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

          pipx --version

      - name: Install MarkItDown
        shell: pwsh
        run: |
          pipx install "markitdown[all]"

      - name: Install Premake5
        uses: abel0b/setup-premake@v2
        with:
          version: "5.0.0-beta2"

      - name: Generate Visual Studio solution
        shell: pwsh
        run: |
          premake5 vs2022

      - name: Build (Release)
        shell: pwsh
        run: |
          $solutionFiles = Get-ChildItem -Path . -Recurse -Filter *.sln
          if ($solutionFiles.Count -eq 0)
          {
            throw "No .sln found after running premake5."
          }

          foreach ($solutionFile in $solutionFiles)
          {
            Write-Host "Building solution: $($solutionFile.FullName)"
            msbuild "$($solutionFile.FullName)" /m /p:Configuration=Release /p:Platform=x64
          }

      - name: Build (Debug)
        shell: pwsh
        run: |
          $solutionFiles = Get-ChildItem -Path . -Recurse -Filter *.sln
          if ($solutionFiles.Count -eq 0)
          {
            throw "No .sln found after running premake5."
          }

          foreach ($solutionFile in $solutionFiles)
          {
            Write-Host "Building solution: $($solutionFile.FullName)"
            msbuild "$($solutionFile.FullName)" /m /p:Configuration=Debug /p:Platform=x64
          }

      - name: Smoke test (Release)
        shell: pwsh
        run: |
          $candidateExecutables = Get-ChildItem -Path . -Recurse -File -Filter jarvisAgent.exe
          if ($candidateExecutables.Count -eq 0)
          {
            Write-Host "No jarvisAgent.exe found for smoke test."
            exit 0
          }

          foreach ($executableFile in $candidateExecutables)
          {
            Write-Host "Running: $($executableFile.FullName) --help"
            try
            {
              & "$($executableFile.FullName)" --help
            }
            catch
            {
              Write-Host "Smoke test failed for $($executableFile.FullName) but continuing."
            }
          }

      - name: Smoke test (Debug)
        shell: pwsh
        run: |
          $candidateExecutables = Get-ChildItem -Path . -Recurse -File -Filter jarvisAgent.exe
          if ($candidateExecutables.Count -eq 0)
          {
            Write-Host "No jarvisAgent.exe found for smoke test."
            exit 0
          }

          foreach ($executableFile in $candidateExecutables)
          {
            Write-Host "Running: $($executableFile.FullName) --help"
            try
            {
              & "$($executableFile.FullName)" --help
            }
            catch
            {
              Write-Host "Smoke test failed for $($executableFile.FullName) but continuing."
            }
          }
