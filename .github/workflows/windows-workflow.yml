name: "🪟Windows"

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install pipx
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --user pipx
          python -m pipx ensurepath

          $pipxBin = Join-Path $env:USERPROFILE ".local\\bin"
          if (Test-Path $pipxBin)
          {
            "$pipxBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

          pipx --version

      - name: Install MarkItDown
        shell: pwsh
        run: |
          pipx install "markitdown[all]"

      - name: Install libpq (PostgreSQL client)
        shell: pwsh
        run: |
          vcpkg install libpq:x64-windows
          $vcpkgRoot = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"
          echo "LIBPQ_DIR=$vcpkgRoot" >> $env:GITHUB_ENV

      - name: Install Premake5
        uses: abel0b/setup-premake@v2
        with:
          version: "5.0.0-beta2"

      - name: Extract version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path premake5.lua -Pattern 'JARVIS_AGENT_VERSION').Line -replace '.*\\"(.*)\\".*','$1'
          echo "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Package version: $v"

      # ---- Engine edition ----

      - name: Generate Visual Studio solution (Engine edition)
        shell: pwsh
        run: |
          premake5 vs2022 --engine

      - name: Build Engine (Release)
        shell: pwsh
        run: |
          $solutionFiles = Get-ChildItem -Path . -Recurse -Filter *.sln
          if ($solutionFiles.Count -eq 0)
          {
            throw "No .sln found after running premake5."
          }

          foreach ($solutionFile in $solutionFiles)
          {
            Write-Host "Building solution: $($solutionFile.FullName)"
            msbuild "$($solutionFile.FullName)" /m /p:Configuration=Release /p:Platform=x64
          }

      - name: Smoke test Engine
        shell: pwsh
        run: |
          $exe = "bin\Release\jarvisAgent-engine.exe"
          if (Test-Path $exe)
          {
            Write-Host "Running: $exe --help"
            try { & $exe --help } catch { Write-Host "Smoke test returned non-zero (ignored)." }
            $global:LASTEXITCODE = 0
          }
          else
          {
            Write-Host "No jarvisAgent-engine.exe found for smoke test."
          }
          exit 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ---- Studio edition (default) ----

      - name: Generate Visual Studio solution (Studio edition)
        shell: pwsh
        run: |
          premake5 vs2022

      - name: Build Studio (Release)
        shell: pwsh
        run: |
          $solutionFiles = Get-ChildItem -Path . -Recurse -Filter *.sln
          if ($solutionFiles.Count -eq 0)
          {
            throw "No .sln found after running premake5."
          }

          foreach ($solutionFile in $solutionFiles)
          {
            Write-Host "Building solution: $($solutionFile.FullName)"
            msbuild "$($solutionFile.FullName)" /m /p:Configuration=Release /p:Platform=x64
          }

      - name: Smoke test Studio
        shell: pwsh
        run: |
          $exe = "bin\Release\jarvisAgent-studio.exe"
          if (Test-Path $exe)
          {
            Write-Host "Running: $exe --help"
            try { & $exe --help } catch { Write-Host "Smoke test returned non-zero (ignored)." }
            $global:LASTEXITCODE = 0
          }
          else
          {
            Write-Host "No jarvisAgent-studio.exe found for smoke test."
          }
          exit 0

      # ---- Packaging (both editions in each package) ----
      # Packaging steps only run on push to main; PRs and feature branches compile only.

      - name: Package ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          packaging\Windows\11\build-zip.ps1

      - name: Upload ZIP artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: JarvisAgent-${{ steps.version.outputs.version }}-Windows-zip
          path: packaging/Windows/11/build/*.zip
          if-no-files-found: warn

      - name: Install WiX v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $wixUrl = "https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311-binaries.zip"
          $wixZip = "$env:TEMP\wix-binaries.zip"
          $wixDir = "C:\tools\wix311"
          Write-Host "Downloading WiX Toolset v3.11.2 ..."
          Invoke-WebRequest -Uri $wixUrl -OutFile $wixZip -UseBasicParsing
          Expand-Archive -Path $wixZip -DestinationPath $wixDir -Force
          "$wixDir" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8
          $env:PATH = "$wixDir;$env:PATH"
          Write-Host "WiX installed: $(& heat.exe 2>&1 | Select-Object -First 1)"

      - name: Package MSI
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          packaging\Windows\11\build-msi.ps1

      - name: Upload MSI artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: JarvisAgent-${{ steps.version.outputs.version }}-Windows-msi
          path: packaging/Windows/11/build/*.msi
          if-no-files-found: warn
